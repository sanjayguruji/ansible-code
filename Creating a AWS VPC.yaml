# create-vpc.yml

---
- name: Create a VPC
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: us-east-1
    vpc_cidr: "10.0.0.0/16"
    vpc_name: "production-vpc"

  tasks:
    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ aws_region }}"
        dns_support: true
        dns_hostnames: true
        tenancy: default
        tags:
          Environment: production
          ManagedBy: ansible
        state: present
      register: vpc

    - name: Show VPC ID
      ansible.builtin.debug:
        msg: "VPC ID: {{ vpc.vpc.id }}"
#Creating Subnets    # Public subnets
    - name: Create public subnet in AZ a
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "10.0.1.0/24"
        az: "{{ aws_region }}a"
        region: "{{ aws_region }}"
        map_public: true
        tags:
          Name: "{{ vpc_name }}-public-a"
          Tier: public
          ManagedBy: ansible
        state: present
      register: public_subnet_a

    - name: Create public subnet in AZ b
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "10.0.2.0/24"
        az: "{{ aws_region }}b"
        region: "{{ aws_region }}"
        map_public: true
        tags:
          Name: "{{ vpc_name }}-public-b"
          Tier: public
          ManagedBy: ansible
        state: present
      register: public_subnet_b

    # Private subnets
    - name: Create private subnet in AZ a
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "10.0.11.0/24"
        az: "{{ aws_region }}a"
        region: "{{ aws_region }}"
        tags:
          Name: "{{ vpc_name }}-private-a"
          Tier: private
          ManagedBy: ansible
        state: present
      register: private_subnet_a

    - name: Create private subnet in AZ b
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "10.0.12.0/24"
        az: "{{ aws_region }}b"
        region: "{{ aws_region }}"
        tags:
          Name: "{{ vpc_name }}-private-b"
          Tier: private
          ManagedBy: ansible
        state: present
      register: private_subnet_b
  #Creating an Internet Gateway
      - name: Create internet gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        tags:
          Name: "{{ vpc_name }}-igw"
          ManagedBy: ansible
        state: present
      register: igw
    #Creating NAT Gateways
        # Allocate Elastic IPs for NAT gateways
    - name: Allocate EIP for NAT gateway a
      amazon.aws.ec2_eip:
        region: "{{ aws_region }}"
        in_vpc: true
        tags:
          Name: "{{ vpc_name }}-nat-eip-a"
          ManagedBy: ansible
        state: present
      register: nat_eip_a

    - name: Allocate EIP for NAT gateway b
      amazon.aws.ec2_eip:
        region: "{{ aws_region }}"
        in_vpc: true
        tags:
          Name: "{{ vpc_name }}-nat-eip-b"
          ManagedBy: ansible
        state: present
      register: nat_eip_b

    # Create NAT gateways in public subnets
    - name: Create NAT gateway in AZ a
      amazon.aws.ec2_vpc_nat_gateway:
        subnet_id: "{{ public_subnet_a.subnet.id }}"
        eip_address: "{{ nat_eip_a.public_ip }}"
        region: "{{ aws_region }}"
        tags:
          Name: "{{ vpc_name }}-nat-a"
          ManagedBy: ansible
        state: present
        wait: true
      register: nat_gw_a

    - name: Create NAT gateway in AZ b
      amazon.aws.ec2_vpc_nat_gateway:
        subnet_id: "{{ public_subnet_b.subnet.id }}"
        eip_address: "{{ nat_eip_b.public_ip }}"
        region: "{{ aws_region }}"
        tags:
          Name: "{{ vpc_name }}-nat-b"
          ManagedBy: ansible
        state: present
        wait: true
      register: nat_gw_b
      #create Route table
          # Public route table - routes to internet gateway
    - name: Create public route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        subnets:
          - "{{ public_subnet_a.subnet.id }}"
          - "{{ public_subnet_b.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        tags:
          Name: "{{ vpc_name }}-public-rt"
          ManagedBy: ansible
      register: public_rt

    # Private route table AZ a - routes to NAT gateway a
    - name: Create private route table AZ a
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        subnets:
          - "{{ private_subnet_a.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            nat_gateway_id: "{{ nat_gw_a.nat_gateway_id }}"
        tags:
          Name: "{{ vpc_name }}-private-rt-a"
          ManagedBy: ansible
      register: private_rt_a

    # Private route table AZ b - routes to NAT gateway b
    - name: Create private route table AZ b
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        subnets:
          - "{{ private_subnet_b.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            nat_gateway_id: "{{ nat_gw_b.nat_gateway_id }}"
        tags:
          Name: "{{ vpc_name }}-private-rt-b"
          ManagedBy: ansible
      register: private_rt_b
