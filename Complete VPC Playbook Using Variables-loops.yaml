# vars/vpc-production.yml
---
vpc_name: production-vpc
vpc_cidr: "10.0.0.0/16"
aws_region: us-east-1

subnets:
  public:
    - cidr: "10.0.1.0/24"
      az: a
      name: public-a
    - cidr: "10.0.2.0/24"
      az: b
      name: public-b
  private:
    - cidr: "10.0.11.0/24"
      az: a
      name: private-a
    - cidr: "10.0.12.0/24"
      az: b
      name: private-b
  database:
    - cidr: "10.0.21.0/24"
      az: a
      name: database-a
    - cidr: "10.0.22.0/24"
      az: b
      name: database-b
      # create-vpc-from-vars.yml
---
- name: Create VPC from variable definitions
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/vpc-production.yml

  tasks:
    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ aws_region }}"
        dns_support: true
        dns_hostnames: true
        tags:
          Environment: production
          ManagedBy: ansible
        state: present
      register: vpc

    - name: Create public subnets
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ item.cidr }}"
        az: "{{ aws_region }}{{ item.az }}"
        region: "{{ aws_region }}"
        map_public: true
        tags:
          Name: "{{ vpc_name }}-{{ item.name }}"
          Tier: public
          ManagedBy: ansible
      loop: "{{ subnets.public }}"
      register: public_subnets

    - name: Create private subnets
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ item.cidr }}"
        az: "{{ aws_region }}{{ item.az }}"
        region: "{{ aws_region }}"
        tags:
          Name: "{{ vpc_name }}-{{ item.name }}"
          Tier: private
          ManagedBy: ansible
      loop: "{{ subnets.private }}"
      register: private_subnets

    - name: Create database subnets
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ item.cidr }}"
        az: "{{ aws_region }}{{ item.az }}"
        region: "{{ aws_region }}"
        tags:
          Name: "{{ vpc_name }}-{{ item.name }}"
          Tier: database
          ManagedBy: ansible
      loop: "{{ subnets.database }}"
      register: database_subnets

    - name: Create internet gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        tags:
          Name: "{{ vpc_name }}-igw"
        state: present
      register: igw

    - name: Create public route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        subnets: "{{ public_subnets.results | map(attribute='subnet.id') | list }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        tags:
          Name: "{{ vpc_name }}-public-rt"
          ManagedBy: ansible

    - name: Show VPC summary
      ansible.builtin.debug:
        msg:
          - "VPC: {{ vpc.vpc.id }}"
          - "Public subnets: {{ public_subnets.results | map(attribute='subnet.id') | list }}"
          - "Private subnets: {{ private_subnets.results | map(attribute='subnet.id') | list }}"
          - "Database subnets: {{ database_subnets.results | map(attribute='subnet.id') | list }}"
          - "Internet Gateway: {{ igw.gateway_id }}"

  #Enable VPC Flow Logs for network traffic monitoring and troubleshooting.
      - name: Create CloudWatch log group for flow logs
      amazon.aws.cloudwatchlogs_log_group:
        log_group_name: "/vpc/{{ vpc_name }}/flow-logs"
        region: "{{ aws_region }}"
        retention: 30
        state: present

        #Querying VPC Information# Get VPC details
- name: Get VPC info
  amazon.aws.ec2_vpc_net_info:
    region: "{{ aws_region }}"
    filters:
      "tag:Name": "{{ vpc_name }}"
  register: vpc_info

- name: Get all subnets in VPC
  amazon.aws.ec2_vpc_subnet_info:
    region: "{{ aws_region }}"
    filters:
      vpc-id: "{{ vpc_info.vpcs[0].id }}"
  register: subnet_info

- name: Show subnet details
  ansible.builtin.debug:
    msg: "{{ item.tags.Name }}: {{ item.id }} ({{ item.cidr_block }}, {{ item.availability_zone }})"
  loop: "{{ subnet_info.subnets }}"
  loop_control:
    label: "{{ item.tags.Name | default(item.id) }}"
        
